services:
  mysql:
    image: mysql:8.0
    # Defaults are the production names. The acceptance stage exports its own
    # values so a staging stack can run beside production on the same host.
    container_name: ${MYSQL_CONTAINER_NAME:-mysql-service}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - student-network

  app:
    image: walaaeddine/devsecops:latest
    container_name: ${APP_CONTAINER_NAME:-student-management}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # The jar is built with a URL pointing at the container name, which only
      # exists in the production stack. Compose gives every service a network
      # alias equal to its service name ("mysql") in any project, so addressing
      # the database that way keeps production and staging both resolvable.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/studentdb?createDatabaseIfNotExist=true}
    ports:
      - "${APP_PORT:-8089}:8089"
    depends_on:
      - mysql
    networks:
      - student-network

  # OPERATIONS phase: blackbox-exporter probes the application over the compose
  # network every time the pipeline asks it to, and can be pointed at a different
  # target per request, so it monitors production and staging alike.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ${BLACKBOX_CONTAINER_NAME:-blackbox-exporter}
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    depends_on:
      - app
    networks:
      - student-network

volumes:
  mysql_data:

networks:
  student-network:
    driver: bridge