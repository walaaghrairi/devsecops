# Template only. Never put real credentials in this file or anywhere else that
# git tracks: the Jenkins "Secrets Management - Production Check" stage fails the
# build when a live value from /opt/student-management/.env appears in source.
#
# Create the Secret out of band, once per cluster:
#
#   kubectl create secret generic mysql-credentials \
#     --from-literal=mysql-root-password='<root password>' \
#     --from-literal=mysql-user='<app user>' \
#     --from-literal=mysql-password='<app password>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# mysql (MysqlDeployment.yaml) and springboot-app (springboot.yaml) both read it
# through valueFrom.secretKeyRef, so the values never appear in a manifest.
#
# The manifest below is the same Secret with placeholder values, kept only to
# show the expected keys. Applying it as-is gives you placeholder credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  mysql-root-password: change-me-root  # pragma: allowlist secret (placeholder, not a credential)
  mysql-user: change-me-user
  mysql-password: change-me-password  # pragma: allowlist secret (placeholder, not a credential)
